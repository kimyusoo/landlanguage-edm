<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>LAND LANGUAGE — AI REAL ESTATE BRIEF · EDM 미리보기</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     로컬 실행용 단일 파일 데모. 서버·빌드 없이 브라우저로 바로 열립니다.
     화면의 정책·뉴스·수치는 모두 DEMO DATA 이며 실제 자료가 아닙니다.
     디자인: stitch_edm / DESIGN.md "Estate Letter Editorial"
  ───────────────────────────────────────────────────────────── */
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root{
    --surface:#faf8ff; --card:#fff; --c-low:#f2f3ff; --c:#eaedff; --c-high:#e2e7ff; --c-highest:#dae2fd;
    --on:#131b2e; --on-var:#444651; --outline:#757682; --outline-var:#c5c5d3;
    --primary:#00236f; --primary-c:#1e3a8a; --on-primary:#fff;
    --secondary:#9b4500; --secondary-c:#fd8a42; --secondary-fixed:#ffdbca; --secondary-fixed-dim:#ffb68e;
    --tertiary:#00312d; --up:#dc2626; --down:#2563eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#e9ecf6; color:var(--on);
    font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.62;
  }

  /* ── 상단 컨트롤 바 ── */
  .toolbar{
    position:sticky; top:0; z-index:20;
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:12px 18px; background:#0f2242; color:#eef1f8;
    box-shadow:0 2px 10px rgba(15,23,42,.18);
  }
  .toolbar .brand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:.14em;font-size:13px}
  .toolbar .brand small{display:block;font-size:9px;color:#c7a15a;letter-spacing:.22em;font-weight:700}
  .seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:8px;padding:3px}
  .seg button{
    border:0;background:transparent;color:#c8d2e8;font:inherit;font-size:12px;font-weight:700;
    padding:6px 12px;border-radius:6px;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:#c7a15a;color:#10243e}
  .toolbar .spacer{flex:1}
  .toolbar .demo{font-size:10px;letter-spacing:.16em;font-weight:700;color:#c7a15a;border:1px dashed #c7a15a;padding:3px 8px;border-radius:4px}
  .toolbar .hint{font-size:11px;color:#9fb0cc}

  /* ── 스테이지 ── */
  .stage{padding:26px 14px 60px;display:flex;justify-content:center;min-height:calc(100vh - 56px)}
  .device{
    background:var(--surface); border-radius:18px; overflow:hidden;
    box-shadow:0 24px 60px -12px rgba(15,23,42,.32), 0 0 0 1px rgba(15,23,42,.06);
    width:100%; transition:max-width .25s ease;
  }
  .device.email{max-width:600px}
  .device.mobile{max-width:400px}
  .device.kakao{max-width:420px;background:var(--primary-c)}
  .device.insta{max-width:480px;background:var(--surface)}

  /* ── EDM 본문 (render.ts와 동일 시스템) ── */
  .ll-edm{background:var(--surface);padding:16px 0 40px}
  .ll-edm *{box-sizing:border-box;margin:0;padding:0}
  .ll-edm .wrap{margin:0 auto;padding:0 14px}
  :where(.ll-edm) a{color:inherit;text-decoration:none}
  .ll-edm h2,.ll-edm h3,.ll-edm h4,.ll-edm .tile-val b,.ll-edm .keyvol{font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif}
  .ll-edm svg{display:block}

  .masthead{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
  .mh-name{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:800;color:var(--primary);letter-spacing:-.01em}
  .mh-pill{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--c-highest);color:var(--primary)}
  .mh-sub{font-size:11px;color:var(--on-var);margin-top:2px;letter-spacing:.02em}
  .mh-ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--primary);background:var(--card);border:1px solid var(--outline-var)}

  .sec{margin-bottom:16px}
  .sechead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .sechead-l{display:flex;align-items:center;gap:7px}
  .sechead-ic{color:var(--primary);display:flex}
  .sechead h3{font-size:17px;font-weight:800;color:var(--on);letter-spacing:-.01em}
  .sechead-sub{font-size:11px;color:var(--on-var);text-align:right;padding-top:3px;max-width:44%}

  .keyrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .keychip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;background:var(--c-highest);color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.03em}
  .keyvol{font-size:11px;font-weight:700;color:var(--on-var);letter-spacing:.06em}
  .keynote{position:relative;overflow:hidden;border-radius:14px;background:var(--primary-c);color:var(--on-primary);padding:20px 20px 18px}
  .keynote .quote{font-family:Georgia,serif;font-size:44px;line-height:0;color:var(--secondary-c);opacity:.9;display:block;height:20px}
  .keynote h2{font-size:20px;font-weight:800;line-height:1.4;letter-spacing:-.015em;margin-top:10px}
  .keynote-sub{display:flex;align-items:flex-start;gap:7px;margin-top:16px;background:rgba(0,0,0,.18);border-radius:9px;padding:10px 11px}
  .keynote-sub svg{color:var(--secondary-c);flex-shrink:0;margin-top:2px}
  .keynote-sub p{font-size:12px;line-height:1.55;color:#e7ebff}

  .lede{background:var(--c-low);border-radius:12px;border-left:3px solid var(--primary);padding:14px 16px}
  .lede-eyebrow{font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--secondary);text-transform:uppercase}
  .lede h3{font-size:18px;font-weight:800;color:var(--primary);line-height:1.45;margin-top:6px;letter-spacing:-.01em}

  .stack{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--outline-var);border-radius:14px;padding:16px}

  .pcard{background:var(--card);border:1px solid var(--outline-var);border-radius:14px;padding:16px;box-shadow:0 2px 4px -1px rgba(15,23,42,.03)}
  .pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;border:1px solid;font-size:11px;font-weight:700}
  .badge .dot{width:6px;height:6px;border-radius:999px;flex-shrink:0}
  .pcard-date{font-size:11px;color:var(--on-var);white-space:nowrap}
  .pcard-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;border:1px solid;font-size:10.5px;font-weight:700}
  .pcard-title{font-size:16px;font-weight:800;color:var(--on);line-height:1.45;margin-top:10px;letter-spacing:-.01em}
  .pcard-bullets{background:var(--c-low);border-radius:10px;padding:11px 12px;margin-top:11px;display:flex;flex-direction:column;gap:8px}
  .bl{display:flex;align-items:flex-start;gap:7px}
  .bl-ic{flex-shrink:0;margin-top:2px;display:flex}
  .bl p{font-size:12.5px;line-height:1.5;color:var(--on)}
  .pcard-impact{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;background:var(--c);border-radius:6px;padding:7px 10px}
  .pcard-impact .lbl{font-size:10.5px;font-weight:700;color:var(--primary);flex-shrink:0}
  .pcard-impact .val{font-size:11px;font-weight:700;color:var(--secondary);text-align:right;line-height:1.4}
  .srcrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .ll-edm .srcbtn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:6px;background:var(--primary);color:#fff;font-size:12px;font-weight:700}
  .ll-edm .srcbtn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}

  .ncard{background:var(--card);border:1px solid var(--outline-var);border-radius:14px;padding:15px}
  .ncard-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
  .ncard-cnt{font-size:10.5px;color:var(--on-var);margin-left:auto}
  .ll-edm .ncard-title{display:block;font-size:15px;font-weight:800;color:var(--primary);line-height:1.45;margin-top:9px;letter-spacing:-.01em}
  .ncard-title .go{display:inline-flex;color:var(--outline);vertical-align:middle;margin-left:2px}
  .ncard-ex{font-size:12.5px;line-height:1.6;color:var(--on);margin-top:6px}

  .artlist{display:flex;flex-direction:column;gap:6px;margin-top:11px;border-top:1px solid var(--c-low);padding-top:10px}
  .art{display:block;background:var(--surface);border:1px solid var(--c-high);border-radius:9px;padding:9px 10px}
  .art-meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--on-var);font-weight:600}
  .art-go{display:inline-flex;align-items:center;gap:3px;margin-left:auto;color:var(--primary);font-weight:700}
  .art-title{font-size:12.5px;font-weight:700;color:var(--on);line-height:1.42;margin-top:3px}
  .art-ex{font-size:11.5px;line-height:1.5;color:var(--on-var);margin-top:3px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--c-low);border-radius:10px;padding:11px 12px}
  .tile-lbl{font-size:10.5px;color:var(--on-var);display:block;line-height:1.4}
  .tile-val{display:flex;align-items:baseline;gap:6px;margin-top:5px;flex-wrap:wrap}
  .tile-val b{font-size:19px;font-weight:800;color:var(--on);letter-spacing:-.02em}
  .tile-val span{font-size:11px;font-weight:700}
  .tile-src{font-size:9.5px;color:var(--outline);display:block;margin-top:5px}
  .tile-src a{color:var(--primary);text-decoration:underline}

  .chart{background:var(--surface);border-radius:10px;padding:11px 12px;margin-top:10px}
  .chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--on-var);font-weight:600}
  .chart-src{color:var(--outline);font-weight:400}
  .bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:96px;margin-top:10px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
  .bar{width:100%;border-radius:4px 4px 0 0}
  .bar-x{font-size:9px;color:var(--outline);white-space:nowrap}

  .persona .prows{display:flex;flex-direction:column}
  .prow{padding:10px 0;border-bottom:1px solid var(--c-low)}
  .prow:last-child{border-bottom:0}
  .prow-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .prow-lbl{font-size:13px;font-weight:700;color:var(--on)}
  .prow-dots{font-size:12px;letter-spacing:2px;color:var(--secondary)}
  .prow-note{font-size:11.5px;line-height:1.55;color:var(--on-var);margin-top:4px}

  .note{font-size:10px;color:var(--outline);line-height:1.5;margin-top:11px}

  .comment{background:linear-gradient(160deg,var(--primary-c),var(--primary));border-radius:14px;padding:18px;color:var(--on-primary)}
  .comment-head{display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .comment-name{display:block;font-size:13px;font-weight:800;color:#fff}
  .comment-tag{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--secondary-fixed);margin-top:2px}
  .comment-body{font-size:12.5px;line-height:1.7;color:#e7ebff;margin-top:11px}

  .cta{background:linear-gradient(150deg,var(--primary-c),var(--primary));border-radius:14px;padding:22px 20px;text-align:center;color:var(--on-primary)}
  .cta-ic{display:inline-flex;color:var(--secondary-c);margin-bottom:6px}
  .cta h3{font-size:16px;font-weight:800;line-height:1.45}
  .cta p{font-size:11.5px;line-height:1.55;color:#dfe4ff;margin:8px auto 0;max-width:320px}
  .cta-btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .cta-btn{display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:7px;font-size:13px;font-weight:800}
  .cta-btn.primary{background:#fff;color:var(--primary)}
  .cta-btn.kakao{background:#FEE500;color:#191919}
  .cta-btn.ghost{background:rgba(255,255,255,.12);color:#fff}

  .foot{margin-top:6px}
  .foot-id{background:var(--c-low);border-radius:12px;padding:14px 15px}
  .foot-id-head{font-size:12px;font-weight:800;color:var(--primary)}
  .foot-grid{margin-top:8px;display:flex;flex-direction:column;gap:3px}
  .foot-grid p{font-size:10.5px;color:var(--on-var);line-height:1.6}
  .foot-grid b{color:var(--on);font-weight:700;margin-right:5px}
  .foot-legal{margin-top:10px;padding:0 3px}
  .foot-legal p{font-size:9.5px;color:var(--outline);line-height:1.6;margin-top:5px}
  .foot-links{margin-top:10px;text-align:center;font-size:10.5px}
  .foot-links a{color:var(--primary);text-decoration:underline}
  .foot-links span{color:var(--outline-var);margin:0 6px}

  /* ── 카카오 카드 미리보기(축소) ── */
  .kakao-frame{display:flex;justify-content:center;padding:18px}
  .kakao-scale{width:1080px;transform-origin:top center}
  .kcard{width:1080px;min-height:1350px;padding:80px 72px;font-family:'Noto Sans KR',sans-serif;color:#fff;background:linear-gradient(165deg,var(--primary-c),var(--primary))}
  .kcard .kbrand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:34px}
  .kcard .kbrand small{display:block;font-size:20px;font-weight:700;color:var(--secondary-c);letter-spacing:.06em;margin-top:8px}
  .kcard .ked{margin-top:56px;font-size:30px;color:var(--secondary-fixed);font-weight:700}
  .kcard h1{margin-top:18px;font-size:60px;font-weight:800;line-height:1.32;letter-spacing:-.02em}
  .kcard .krule{margin-top:52px;width:120px;height:5px;background:var(--secondary-c);border-radius:3px}
  .kcard ol{margin-top:44px;list-style:none;display:flex;flex-direction:column;gap:30px}
  .kcard li{font-size:36px;line-height:1.45;display:flex;gap:20px}
  .kcard li b{color:var(--secondary-c);font-family:'Plus Jakarta Sans',sans-serif}
  .kcard .ktail{margin-top:64px;font-size:28px;color:#c7d0ec;line-height:1.6}
  .kcard .kfoot{margin-top:52px;font-size:30px;font-weight:700}

  /* ── 인스타그램 카드뉴스 ── */
  .insta{padding:16px 16px 40px}
  .insta-titles .it-head{font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif;font-size:16px;font-weight:800;color:var(--primary);margin-bottom:4px}
  .insta-titles .it-head span{display:block;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:500;color:var(--on-var);margin-top:3px}
  .insta-titles .it-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .it-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--card);border:1px solid var(--outline-var);border-radius:12px;padding:13px 14px;cursor:pointer;font:inherit;transition:.15s}
  .it-row:hover{border-color:var(--primary);background:var(--c-low)}
  .it-badge{flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:5px;background:var(--c-highest);color:var(--primary)}
  .it-title{flex:1;font-size:13.5px;font-weight:700;color:var(--on);line-height:1.45}
  .it-go{flex-shrink:0;color:var(--primary);font-weight:800}

  .insta-controls{background:var(--card);border:1px solid var(--outline-var);border-radius:12px;padding:12px 13px;margin-bottom:14px}
  .ic-back{border:0;background:transparent;color:var(--primary);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0}
  .count-label{font-size:11px;color:var(--on-var);font-weight:700;margin:10px 0 6px}
  .count-seg{display:flex;flex-wrap:wrap;gap:5px}
  .count-seg button{width:34px;height:32px;border:1px solid var(--outline-var);background:#fff;border-radius:7px;font:inherit;font-size:12px;font-weight:700;color:var(--on-var);cursor:pointer;transition:.12s}
  .count-seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .count-hint{font-size:10px;color:var(--outline);margin-top:8px;line-height:1.5}

  .insta-deck{display:flex;flex-direction:column;gap:14px}
  .icard-scale{align-self:center;overflow:hidden;border-radius:16px;box-shadow:0 12px 32px -10px rgba(15,23,42,.32)}
  .icard{width:1080px;height:1350px;padding:88px 84px;display:flex;flex-direction:column;font-family:'Noto Sans KR',sans-serif;color:#fff;background:linear-gradient(165deg,var(--primary-c),var(--primary));position:relative;overflow:hidden;transform-origin:top left}
  .icard .ic-top{display:flex;align-items:center;justify-content:space-between}
  .ic-brandname{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:30px;letter-spacing:.01em}
  .ic-idx{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:26px;color:var(--secondary-c);letter-spacing:.08em}
  .ic-kicker{margin-top:64px;font-size:28px;font-weight:700;color:var(--secondary-fixed)}
  .icard h1{margin-top:24px;font-size:76px;font-weight:800;line-height:1.28;letter-spacing:-.02em}
  .ic-rule{margin-top:48px;width:130px;height:6px;background:var(--secondary-c);border-radius:3px}
  .ic-tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:14px}
  .ic-tag{font-size:26px;font-weight:700;color:#c7d0ec}
  .ic-eyebrow{margin-top:60px;font-size:30px;font-weight:800;color:var(--secondary-c);letter-spacing:.02em}
  .ic-eyebrow::before{content:"";display:block;width:64px;height:5px;background:var(--secondary-c);border-radius:3px;margin-bottom:22px}
  .ic-bodytext{margin-top:34px;font-size:40px;line-height:1.55;font-weight:500;color:#eef1ff;flex:1}
  .ic-foot{margin-top:40px;font-size:22px;color:#aab6d8;line-height:1.6;border-top:1px solid rgba(255,255,255,.14);padding-top:24px}
  .icard.cta{justify-content:center;text-align:left}
  .ic-cta-ic{width:96px;height:96px;border-radius:24px;background:rgba(255,255,255,.12);color:var(--secondary-c);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ic-cta-ic svg{width:52px;height:52px}
  .icard.cta h2{margin-top:44px;font-size:66px;font-weight:800;line-height:1.32;letter-spacing:-.02em}
  .icard.cta p{margin-top:26px;font-size:34px;color:#dfe4ff;line-height:1.5;max-width:840px}
  .ic-phone{margin-top:52px;align-self:flex-start;display:inline-flex;align-items:center;gap:18px;background:#fff;color:var(--primary);font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:42px;padding:26px 40px;border-radius:16px}
  .ic-phone svg{width:40px;height:40px}
  .icard.solo h1{font-size:64px}
  .icard.solo .ic-bodytext{font-size:36px;margin-top:44px}

  .sendbar{display:inline-flex;gap:6px}
  .sendbar button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#eef1f8;font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:7px;cursor:pointer;transition:.15s}
  .sendbar button:hover{background:#c7a15a;color:#10243e;border-color:#c7a15a}
  #feedStatus{white-space:nowrap}
  #feedStatus.live{border-color:#3fbf7f;color:#8fe3b6}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#10243e;color:#fff;font-size:13px;font-weight:600;padding:12px 20px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:50;max-width:90vw;text-align:center}

  @media(max-width:820px){
    .toolbar{gap:8px;padding:10px 12px}

function agencyStyle(a){
  a = a || '';
  if(/국세청|세무/.test(a)) return {bg:'#cffaf1',fg:'#0f3f3a',bd:'#99f0e2',dot:'#00312d'};
  if(/기획재정부|기재부|금융위|한국은행|금융/.test(a)) return {bg:'#ffe6d1',fg:'#7a3300',bd:'#ffcda6',dot:'#9b4500'};
  return {bg:'#e2e7ff',fg:'#00236f',bd:'#c8d2ff',dot:'#00236f'};
}
function statusPill(s){
  const ok = s==='CONFIRMED'||s==='SCHEDULED';
  const bg=ok?'#dcfce7':'#fef3c7', fg=ok?'#166534':'#92400e', bd=ok?'#bbf7d0':'#fde68a';
  return `<span class="pill" style="background:${bg};color:${fg};border-color:${bd}">${STATUS_LABEL[s]||s}</span>`;
}
const needsCheckPill = `<span class="pill" style="background:#fff;color:#9b4500;border-color:#ffb68e">확인 필요</span>`;
const dots = n => '●'.repeat(n)+'○'.repeat(5-n);

const cleanForSearch = s => (s||'').replace(/\s*\(DEMO DATA\)\s*$/,'').replace(/["'“”…]/g,' ').replace(/\s+/g,' ').trim();
const naverNews = q => 'https://search.naver.com/search.naver?where=news&sm=tab_jum&query=' + encodeURIComponent(cleanForSearch(q));
const naverAll  = q => 'https://search.naver.com/search.naver?query=' + encodeURIComponent(cleanForSearch(q));

// 실시간 뉴스가 수집되면 각 기사의 실제(직접) URL 로, 아니면 제목 검색으로 폴백
const isDirectUrl = u => !!u && /^https?:\/\/[^/]+\/.+/.test(u) && !/^https?:\/\/(www\.)?[a-z0-9.\-]+\/?$/i.test(u);
const linkFor = a => isDirectUrl(a.url) ? a.url : naverNews(a.title);

function articleLinks(arts){
  if(!arts || !arts.length) return '';
  return `<div class="artlist">${arts.map(a=>`
    <a class="art" href="${esc(linkFor(a))}" target="_blank" rel="noreferrer noopener">
      <div class="art-meta">${esc(a.publisher)} · ${esc(a.date.replace(/-/g,'.'))}<span class="art-go">기사 보기 ${ICO.ext}</span></div>
      <div class="art-title">${esc(a.title)}</div>
      <div class="art-ex">${esc(clamp(a.excerpt,110))}</div>
    </a>`).join('')}</div>`;
}
function miniBars(h){
  if(!h || h.length<2) return '';
  const vals=h.map(p=>p[1]), max=Math.max(...vals), min=Math.min(...vals), span=(max-min)||1;
  return `<div class="bars">${h.map((p,i)=>{
    const ht=24+Math.round(((p[1]-min)/span)*60), last=i===h.length-1;
    return `<div class="bar-col"><div class="bar" style="height:${ht}px;background:${last?'#00236f':'#dae2fd'}"></div><span class="bar-x">${esc(p[0])}</span></div>`;
  }).join('')}</div>`;
}
function secHead(icon,title,sub){
  return `<div class="sechead"><div class="sechead-l"><span class="sechead-ic">${icon}</span><h3>${esc(title)}</h3></div><span class="sechead-sub">${esc(sub)}</span></div>`;
}

}

/* ───────────── 인스타그램 카드뉴스 ───────────── */
const PERIOD_KO = {DAILY:'일간', WEEKLY:'주간', MONTHLY:'월간'};
const cleanTitle = s => (s||'').replace(/\s*\(DEMO DATA\)\s*$/,'').trim();

/* 한 이슈를 n장(1~10)의 카드뉴스 슬라이드로 구성 */
function instaSlides(it, n){
  const pool = [
    {ey:'무슨 내용인가요?',            tx: it.whatHappened},
    {ey:'누구에게 영향을 주나요?',      tx: it.audience.join('   ')},
    {ey:'공인중개사 POINT ①',          tx: it.bullets[0] || ''},
    {ey:'공인중개사 POINT ②',          tx: it.bullets[1] || ''},
    {ey:'공인중개사 POINT ③',          tx: it.bullets[2] || ''},
    {ey:'무주택자 · 매수예정자 영향',   tx: it.persona.filter(p=>/무주택|매수/.test(p[0])).map(p=>`${p[0]}  ${dots(p[1])}\n${p[2]}`).join('\n\n')},
    {ey:'1주택자 · 다주택자 영향',      tx: it.persona.filter(p=>/1주택|다주택/.test(p[0])).map(p=>`${p[0]}  ${dots(p[1])}\n${p[2]}`).join('\n\n')},
    {ey:'지금 무엇을 확인해야 하나요?', tx: it.impact},
  ].filter(s => s.tx && s.tx.trim());

  if(n <= 1) return [{kind:'solo', it}];
  const slides = [{kind:'cover', it}];
  const bodyCount = Math.min(n - 2, pool.length);
  for(let i=0;i<bodyCount;i++) slides.push({kind:'body', it, ...pool[i]});
  slides.push({kind:'cta', it});
  return slides;
}

function icardHTML(slide, idx, total){
  const it = slide.it;
  const num = `${String(idx+1).padStart(2,'0')} / ${total}`;
  const brandTop = `<span class="ic-brandname">${esc(BRAND.officeName)}</span><span class="ic-idx">${num}</span>`;
  const foot = `${esc(BRAND.brandName)} · ${esc(BRAND.mobile)}`;

  if(slide.kind === 'solo'){
    return `<div class="icard solo">
      <div class="ic-top">${brandTop}</div>
      <div class="ic-kicker">${esc(KIND[curType].brief)} · ${esc(KIND[curType].ed)}</div>
      <h1>${esc(cleanTitle(it.oneLiner))}</h1>
      <div class="ic-rule"></div>
      <p class="ic-bodytext">${esc(it.whatHappened)}</p>
      <div class="ic-foot">${esc(it.audience.join('  '))}<br>${foot}</div>
    </div>`;
  }
  if(slide.kind === 'cover'){
    return `<div class="icard cover">
      <div class="ic-top">${brandTop}</div>
      <div class="ic-kicker">${esc(KIND[curType].brief)} · ${esc(KIND[curType].ed)}</div>
      <h1>${esc(cleanTitle(it.oneLiner))}</h1>
      <div class="ic-rule"></div>
      <div class="ic-tags">${it.audience.map(t=>`<span class="ic-tag">${esc(t)}</span>`).join('')}</div>
      <div class="ic-foot">${foot}  ·  넘겨보세요 →</div>
    </div>`;
  }
  if(slide.kind === 'cta'){
    return `<div class="icard cta">
      <span class="ic-idx" style="position:absolute;top:88px;right:84px">${num}</span>
      <div class="ic-cta-ic">${ICO.chat}</div>
      <h2>이 정책이 내 집에는<br>어떤 영향을 줄까요?</h2>
      <p>매도·매수·갈아타기·정책 상담 — 전문 공인중개사가<br>AI 분석과 함께 정리해 드립니다.</p>
      <div class="ic-phone">${ICO.phone}<span>${esc(BRAND.mobile)}</span></div>
      <div class="ic-foot" style="margin-top:64px">${esc(BRAND.officeName)} · ${esc(BRAND.brandName)}<br>${esc(BRAND.address)}<br>광고 수신거부 안내 포함 · 본 이미지는 DEMO DATA 입니다.</div>
    </div>`;
  }
  // body
  return `<div class="icard body">
    <div class="ic-top">${brandTop}</div>
    <div class="ic-eyebrow">${esc(slide.ey)}</div>
    <p class="ic-bodytext">${esc(slide.tx).replace(/\n/g,'<br>')}</p>
    <div class="ic-foot">${esc(cleanTitle(it.oneLiner))}<br>${foot}</div>
  </div>`;
}

function renderInsta(typeKey){
  const K = KIND[typeKey];
  const list = ISSUES.slice(0, K.news);

  if(instaIssue == null){
    return `<div class="insta-titles">
      <div class="it-head">${PERIOD_KO[typeKey]} 카드뉴스<span>주제를 선택하면 카드 장수(1~10장)를 골라 카드뉴스를 만듭니다</span></div>
      <div class="it-list">
        ${list.map((it,i)=>`<button class="it-row" data-insta-issue="${i}">
          <span class="it-badge">${esc(it.agency || '이슈')}</span>
          <span class="it-title">${esc(cleanTitle(it.oneLiner))}</span>
          <span class="it-go">→</span>
        </button>`).join('')}
      </div>
    </div>`;
  }

  const it = list[instaIssue] || list[0];
  const slides = instaSlides(it, instaCount);
  const shortfall = instaCount >= 3 && slides.length < instaCount;

  return `<div class="insta-controls">
    <button class="ic-back" data-insta-back>← 주제 다시 선택</button>
    <div class="count-label">카드 장수 — <b>${slides.length}장</b> 생성됨</div>
    <div class="count-seg">
      ${Array.from({length:10},(_,i)=>i+1).map(n=>`<button data-insta-count="${n}" class="${n===instaCount?'on':''}">${n}</button>`).join('')}
    </div>
    ${shortfall ? `<div class="count-hint">이 주제는 콘텐츠 기준 최대 ${slides.length}장까지 구성됩니다.</div>` : ''}
    <div class="count-hint">선택 주제: ${esc(cleanTitle(it.oneLiner))}</div>
  </div>
  <div class="insta-deck">
    ${slides.map((s,i)=>`<div class="icard-scale">${icardHTML(s,i,slides.length)}</div>`).join('')}
  </div>`;
}

/* ───────────── 컨트롤 ───────────── */
let curType='DAILY', curView='email';
let instaIssue=null, instaCount=5;
const device = document.getElementById('device');

function fitKakao(){
  const s = device.querySelector('#kscale'); if(!s) return;
  const k = device.clientWidth / 1080;
  s.style.transform = 'scale('+k+')';
  s.style.height = (1350*k)+'px';
}
function fitInsta(){
  const w = device.clientWidth - 32;
  device.querySelectorAll('.icard-scale').forEach(wrap=>{
    const k = w / 1080;
    wrap.style.width = w+'px';
    wrap.style.height = (1350*k)+'px';
    const card = wrap.firstElementChild;
    if(card) card.style.transform = 'scale('+k+')';
  });
}

function paint(){
  device.className = 'device '+curView;
  if(curView==='kakao'){
    device.innerHTML = renderKakao(curType);
    fitKakao();
  } else if(curView==='insta'){
    device.innerHTML = renderInsta(curType);
    if(instaIssue != null) fitInsta();
  } else {
    device.innerHTML = renderEDM(curType);
  }
}
function wire(id, cb){
  const seg = document.getElementById(id);
  seg.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    [...seg.children].forEach(x=>x.classList.toggle('on', x===b));
    cb(b.dataset.v);
  });
}
wire('typeSeg', v=>{ curType=v; instaIssue=null; paint(); });
wire('viewSeg', v=>{ curView=v; instaIssue=null; paint(); });

device.addEventListener('click', e=>{
  const issueBtn = e.target.closest('[data-insta-issue]');
  if(issueBtn){ instaIssue = +issueBtn.dataset.instaIssue; paint(); return; }
  const countBtn = e.target.closest('[data-insta-count]');
  if(countBtn){ instaCount = +countBtn.dataset.instaCount; paint(); return; }
  if(e.target.closest('[data-insta-back]')){ instaIssue = null; paint(); return; }
});

window.addEventListener('resize', ()=>{ if(curView==='kakao' || curView==='insta') paint(); });

/* ───────────── 실시간 뉴스 (same-origin news.json) ───────────── */
/* news.json 은 GitHub Actions 가 Google News RSS 를 수집해 주기적으로 커밋합니다.
   있으면 각 이슈의 기사·헤드라인·원문 링크가 실제(직접) 기사 URL 로 교체되고,
   없으면(로컬 파일 직접 열기 등) 내장 데모 + 제목 검색 링크로 폴백합니다. */
let FEED_LIVE = false;
async function hydrateNews(){
  let feed = null;
  try{
    const r = await fetch('news.json?ts=' + Date.now(), { cache:'no-store' });
    if(r.ok) feed = await r.json();
  }catch(_){ /* file:// 등에서는 무시 */ }

  const st = document.getElementById('feedStatus');
  if(feed && feed.topics){
    ISSUES.forEach(it => {
      const arts = it.topicId && feed.topics[it.topicId];
      if(arts && arts.length){
        it.articles = arts.slice(0, 4);
        it.liveUrl = arts[0].url;        // 헤드라인 / 원문 버튼이 향할 실제 기사
        it.announced = arts[0].date || it.announced;
        // 제목·내용을 실제 기사에 맞추고, 해설은 방향(인상/인하/확정/검토)에 좌우되지 않는 가이드로 교체
        it.oneLiner = cleanTitle(arts[0].title);
        it.headline = arts[0].title;
        it.whatHappened = (arts.find(a => a.excerpt && a.excerpt.length > 20)?.excerpt)
          || '주요 언론이 비중 있게 다룬 이슈입니다. 아래 기사 원문에서 구체적인 수치·일정·대상을 확인하세요.';
        it.bullets = [
          '헤드라인보다 적용 대상·시행 시점·구체 수치를 원문에서 먼저 확인하세요.',
          '고객 상황(주택 수·지역·보유기간·대출 유형)에 따라 영향이 달라짐을 안내하세요.',
          '확정된 내용과 논의·전망 단계를 구분해 설명하세요.',
        ];
        it.impact = '기사 원문에서 적용 지역·시행일·대상 요건을 확인한 뒤 본인 상황에 맞춰 판단하세요.';
        it.persona = [
          ['무주택자', 3, '매수 계획이 있다면 대출 한도·금리 시나리오를 다시 점검하세요.'],
          ['1주택자', 3, '보유·갈아타기 판단에 앞서 본인 대출 조건과 세금 요건을 확인하세요.'],
          ['다주택자', 3, '세제·대출 규제와 보유 비용 변화 가능성을 함께 점검하세요.'],
          ['매수 예정자', 3, '자금 계획과 매수 시점을 기사 원문의 구체 조건에 맞춰 재검토하세요.'],
          ['매도 예정자', 3, '거래량·가격 흐름과 세금 일정을 확인해 매도 전략을 조정하세요.'],
          ['임대인', 2, '임대차 관련 제도 변화 여부를 별도로 확인하세요.'],
          ['임차인', 2, '전월세·대출 조건 변화 가능성을 확인하세요.'],
        ];
        FEED_LIVE = true;
      }
    });
  }
  if(FEED_LIVE){
    const when = feed.generatedAt ? new Date(feed.generatedAt) : new Date();
    st.textContent = '실시간 뉴스 · ' + when.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) + ' 수집';
    st.classList.add('live');
  }else{
    st.textContent = 'DEMO DATA';
  }
}

/* ───────────── 메일 / 카카오톡 전송 ───────────── */
const KAKAO_JS_KEY = ''; // 카카오 JavaScript 키를 넣으면 공식 "카카오톡 공유"가 활성화됩니다.

function pageUrl(){
  const u = new URL(location.href);
  u.searchParams.set('t', curType);
  u.hash = '';
  return u.toString();
}
function briefPayload(){
  const K = KIND[curType];
  const items = ISSUES.slice(0, 3).map((it,i)=>`${['①','②','③'][i]} ${cleanTitle(it.oneLiner)}`).join('\n');
  const subject = `[${K.title}] ${K.ed}`;
  const body =
`${K.title}  ·  ${K.ed}

${cleanTitle(ISSUES[0].oneLiner)}

오늘 꼭 확인할 이슈
${items}

복잡한 부동산 정책을 일반인의 눈높이에서 쉽게 정리해드립니다.

▶ 전체 브리핑 보기
${pageUrl()}

${BRAND.officeName} · ${BRAND.brandName}
${BRAND.mobile}`;
  return { subject, body };
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.hidden = true; }, 3200);
}
function sendMail(){
  const { subject, body } = briefPayload();
  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const gmail  = `https://mail.google.com/mail/?view=cm&fs=1&tf=1&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  // 기본 메일 앱을 열고, 열리지 않으면 Gmail 작성 화면으로
  const before = Date.now();
  location.href = mailto;
  setTimeout(()=>{ if(document.hasFocus() && Date.now()-before < 1500) window.open(gmail, '_blank', 'noopener'); }, 700);
  toast('메일 작성 창을 엽니다. (기본 메일 앱 또는 Gmail)');
}
async function sendKakao(){
  const { subject, body } = briefPayload();
  if(KAKAO_JS_KEY && window.Kakao && window.Kakao.Share){
    window.Kakao.Share.sendDefault({
      objectType:'feed',
      content:{ title: subject, description: cleanTitle(ISSUES[0].oneLiner),
        imageUrl: 'https://kimyusoo.github.io/landlanguage-edm/og.png',
        link:{ mobileWebUrl: pageUrl(), webUrl: pageUrl() } },
      buttons:[{ title:'브리핑 보기', link:{ mobileWebUrl: pageUrl(), webUrl: pageUrl() } }],
    });
    return;
  }
  if(navigator.share){
    try{ await navigator.share({ title: subject, text: body, url: pageUrl() }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(body); toast('카카오톡 메시지가 복사되었습니다. 대화창에 붙여넣어 전송하세요.'); }
  catch(_){ window.prompt('아래 내용을 복사해 카카오톡에 붙여넣으세요.', body); }
}
function copyLink(){
  navigator.clipboard.writeText(pageUrl())
    .then(()=>toast('링크가 복사되었습니다.'))
    .catch(()=>window.prompt('링크 복사', pageUrl()));
}
document.getElementById('btnMail').addEventListener('click', sendMail);
document.getElementById('btnKakao').addEventListener('click', sendKakao);
document.getElementById('btnCopy').addEventListener('click', copyLink);

if(KAKAO_JS_KEY){
  const s = document.createElement('script');
  s.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';
  s.onload = ()=>{ try{ window.Kakao.init(KAKAO_JS_KEY); }catch(_){} };
  document.head.appendChild(s);
}
